<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>202610301221</title><style>*{margin:0;padding:0;box-sizing:border-box;}body{width:100%;height:100vh;background:#000;overflow:hidden;font-family:'Arial',sans-serif;}#canvas{display:block;background:#000;}</style></head><body><canvas id="canvas"></canvas><script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];
const starCount = 150;

class Star {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 1.5;
        this.baseOpacity = Math.random() * 0.5 + 0.3;
        this.opacity = this.baseOpacity;
        this.flickerSpeed = Math.random() * 0.02 + 0.01;
        this.flickerAmount = Math.random() * 0.4 + 0.1;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = (Math.random() - 0.5) * 0.3;
        this.pulsePhase = Math.random() * Math.PI * 2;
        this.pulseSpeed = Math.random() * 0.02 + 0.005;
        const colorTemp = Math.random();
        if (colorTemp > 0.7) {
            this.color = `rgb(255, 200, 150)`;
        } else if (colorTemp > 0.4) {
            this.color = `rgb(200, 220, 255)`;
        } else {
            this.color = `rgb(255, 255, 255)`;
        }
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < -10) this.x = canvas.width + 10;
        if (this.x > canvas.width + 10) this.x = -10;
        if (this.y < -10) this.y = canvas.height + 10;
        if (this.y > canvas.height + 10) this.y = -10;

        this.opacity = this.baseOpacity + Math.sin(Date.now() * this.flickerSpeed) * this.flickerAmount;

        this.pulsePhase += this.pulseSpeed;
        const pulse = Math.sin(this.pulsePhase) * 0.5 + 0.5;
        this.radius = (Math.random() * 1.5 + 0.5) * (pulse * 0.5 + 0.7);
    }

    draw() {
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.opacity);
        
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        const glowRadius = this.radius * 2.5;
        const gradient = ctx.createRadialGradient(this.x, this.y, this.radius, this.x, this.y, glowRadius);
        gradient.addColorStop(0, this.color);
        gradient.addColorStop(1, 'transparent');
        
        ctx.fillStyle = gradient;
        ctx.globalAlpha = this.opacity * 0.3;
        ctx.beginPath();
        ctx.arc(this.x, this.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }
}

function initStars() {
    stars.length = 0;
    for (let i = 0; i < starCount; i++) {
        stars.push(new Star());
    }
}

function animate() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let star of stars) {
        star.update();
        star.draw();
    }

    const bottomGradient = ctx.createLinearGradient(0, canvas.height - 200, 0, canvas.height);
    bottomGradient.addColorStop(0, 'rgba(0, 50, 150, 0)');
    bottomGradient.addColorStop(1, 'rgba(0, 80, 200, 0.1)');
    ctx.fillStyle = bottomGradient;
    ctx.fillRect(0, canvas.height - 200, canvas.width, 200);

    requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

initStars();
animate();
</script></body></html>
