[versions]
agp = "8.13.2"
kotlin = "2.3.21"

# AndroidX
coreKtx = "1.13.1"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
navigationCompose = "2.8.4"
datastore = "1.1.1"

composeBom = "2024.12.01"

ktor = "3.4.3"

ucrop = "2.2.11-native"
appcompat = "1.7.0"


androidxTransition = "1.7.0"
kotlinxSerialization = "1.7.3"
jlatexmath = "1.5"
termux = "0.118.0"
kotlinxCoroutines = "1.9.0"

[libraries]
androidx-core-ktx                       = { group = "androidx.core",                name = "core-ktx",                  version.ref = "coreKtx" }
androidx-activity-compose                = { group = "androidx.activity",            name = "activity-compose",          version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx           = { group = "androidx.lifecycle",           name = "lifecycle-runtime-ktx",     version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose     = { group = "androidx.lifecycle",           name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose              = { group = "androidx.navigation",           name = "navigation-compose",        version.ref = "navigationCompose" }

androidx-compose-bom                     = { group = "androidx.compose",              name = "compose-bom",               version.ref = "composeBom" }
androidx-compose-ui                      = { group = "androidx.compose.ui",           name = "ui" }
androidx-compose-ui-graphics             = { group = "androidx.compose.ui",           name = "ui-graphics" }
androidx-compose-ui-tooling-preview      = { group = "androidx.compose.ui",           name = "ui-tooling-preview" }
androidx-compose-ui-tooling              = { group = "androidx.compose.ui",           name = "ui-tooling" }
androidx-compose-ui-test-manifest        = { group = "androidx.compose.ui",           name = "ui-test-manifest" }
androidx-compose-material3                = { group = "androidx.compose.material3",    name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material",     name = "material-icons-extended" }
androidx-compose-foundation              = { group = "androidx.compose.foundation",   name = "foundation" }

androidx-datastore-preferences           = { group = "androidx.datastore",            name = "datastore-preferences",    version.ref = "datastore" }

junit                                    = { group = "junit",                       name = "junit",                       version = "4.13.2" }

ktor-client-core                        = { group = "io.ktor",                       name = "ktor-client-core",                  version.ref = "ktor" }
ktor-client-okhttp                      = { group = "io.ktor",                       name = "ktor-client-okhttp",                version.ref = "ktor" }
ktor-client-content-negotiation         = { group = "io.ktor",                       name = "ktor-client-content-negotiation",   version.ref = "ktor" }

ucrop = { group = "com.github.yalantis", name = "ucrop", version.ref = "ucrop" }
androidx-appcompat                        = { group = "androidx.appcompat",             name = "appcompat",                    version.ref = "appcompat" }
androidx-documentfile                    = { group = "androidx.documentfile",         name = "documentfile",                version = "1.0.1" }
xz                                       = { module = "org.tukaani:xz",               version = "1.12" }
exifinterface                            = { group = "androidx.exifinterface",       name = "exifinterface",             version = "1.3.7" }

androidx-transition                       = { group = "androidx.transition",            name = "transition",                   version.ref = "androidxTransition" }
jlatexmath = { module = "com.github.rikkahub.jlatexmath-android:jlatexmath", version.ref = "jlatexmath" }
termux-terminal-view = { module = "com.termux.termux-app:terminal-view", version.ref = "termux" }
jlatexmath-font-greek = { module = "com.github.rikkahub.jlatexmath-android:jlatexmath-font-greek", version.ref = "jlatexmath" }
jlatexmath-font-cyrillic = { module = "com.github.rikkahub.jlatexmath-android:jlatexmath-font-cyrillic", version.ref = "jlatexmath" }
ktor-serialization-kotlinx-json        = { group = "io.ktor",                       name = "ktor-serialization-kotlinx-json",   version.ref = "ktor" }
ktor-client-logging                     = { group = "io.ktor",                       name = "ktor-client-logging",               version.ref = "ktor" }

kotlinx-serialization-json              = { group = "org.jetbrains.kotlinx",         name = "kotlinx-serialization-json",        version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android              = { group = "org.jetbrains.kotlinx",         name = "kotlinx-coroutines-android",        version.ref = "kotlinxCoroutines" }

[plugins]
android-application = { id = "com.android.application",                version.ref = "agp" }
kotlin-android     = { id = "org.jetbrains.kotlin.android",            version.ref = "kotlin" }
kotlin-compose     = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
